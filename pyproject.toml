[project]
name = "dotnet-code-advisor"
version = "0.2.0"
description = "A grounded, read-only MCP code advisor for C#, WebForms and JavaScript."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Dotnet-Code-Advisor-Monetization-Restricted"
license-files = ["LICENSE"]
dependencies = [
  "mcp>=2.1.1,<3",
  "tree-sitter>=0.25.0,<0.27",
  "tree-sitter-language-pack>=1.16.1",
  "pydantic>=2.9",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "hatchling>=1.27"]

[project.scripts]
dotnet-code-advisor = "dotnet_code_advisor.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["config.toml", "config.*.local.toml", ".index", ".venv", "**/bin", "**/obj", "**/__pycache__", ".pytest_cache", "dist", "*.log", "*.db", "*.db-*", "*.jsonl", ".env", ".env.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/dotnet_code_advisor"]

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "roslyn-host", "markup-codegen", "tests", "examples", "docs", "README.md", "AGENTS.md", "LICENSE", "config.example.toml", "NuGet.Config", "pyproject.toml", ".gitignore", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["compiler: optional real compiler integration checks"]
